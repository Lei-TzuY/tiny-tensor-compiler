name: Conquest direct matmul construction

on:
  push:
    branches:
      - feat/direct-matmul-kernel

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply anchored production patch
        run: python tools/apply_direct_matmul_lowering.py
      - name: Verify
        run: |
          ruff check .
          pytest
      - name: Remove construction files and commit verified slice
        run: |
          git rm tools/apply_direct_matmul_lowering.py .github/workflows/conquest-direct-matmul.yml
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: lower compositional matmul directly"
          git push origin HEAD:feat/direct-matmul-kernel
