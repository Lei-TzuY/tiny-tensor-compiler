name: Conquest direct matmul construction

on:
  push:
    branches:
      - feat/direct-matmul-kernel

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Narrow construction-only changelog anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_direct_matmul_lowering.py")
          text = path.read_text(encoding="utf-8")
          old = '    "### Added\\n\\n",\n    "### Added\\n\\n- Direct verified physical lowering'
          new = '    "## [Unreleased]\\n\\n### Added\\n\\n",\n    "## [Unreleased]\\n\\n### Added\\n\\n- Direct verified physical lowering'
          if text.count(old) != 1:
              raise RuntimeError("construction changelog anchor rewrite did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply anchored production patch
        run: |
          set +e
          python tools/apply_direct_matmul_lowering.py > construction-error.txt 2>&1
          status=$?
          cat construction-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add construction-error.txt
            git commit -m "chore: capture direct matmul patch failure"
            git push origin HEAD:feat/direct-matmul-kernel
            exit "$status"
          fi
          rm construction-error.txt
      - name: Normalize patch style and test imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/tiny_tensor_compiler/c_codegen.py")
          text = path.read_text(encoding="utf-8")
          old1 = '''            f"                    volatile {c_type} matmul_product = "\n            f"(({c_type}){lhs_ref} * ({c_type}){rhs_ref});",'''
          new1 = '''            (\n                f"                    volatile {c_type} matmul_product = "\n                f"(({c_type}){lhs_ref} * ({c_type}){rhs_ref});"\n            ),'''
          old2 = '''            f"                    matmul_value = "\n            f"(({c_type})matmul_value + ({c_type})matmul_product);",'''
          new2 = '''            (\n                f"                    matmul_value = "\n                f"(({c_type})matmul_value + ({c_type})matmul_product);"\n            ),'''
          for old, new in ((old1, new1), (old2, new2)):
              if text.count(old) != 1:
                  raise RuntimeError("direct matmul C style normalization anchor mismatch")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test = Path("tests/test_direct_matmul_lowering.py")
          text = test.read_text(encoding="utf-8")
          old = '''from tiny_tensor_compiler import (\n    GraphBuilder,\n    analyze_module,\n'''
          new = '''from tiny_tensor_compiler import (\n    GraphBuilder,\n'''
          if text.count(old) != 1:
              raise RuntimeError("direct matmul analysis import anchor mismatch")
          text = text.replace(old, new, 1)
          insertion = 'import numpy as np\n\nfrom tiny_tensor_compiler import ('
          replacement = 'import numpy as np\n\nfrom tiny_tensor_compiler.analysis import analyze_module\nfrom tiny_tensor_compiler import ('
          if text.count(insertion) != 1:
              raise RuntimeError("direct matmul analysis import insertion mismatch")
          test.write_text(text.replace(insertion, replacement, 1), encoding="utf-8")
          PY
          ruff check . --fix
      - name: Verify
        run: |
          set +e
          { ruff check . && pytest; } > construction-error.txt 2>&1
          status=$?
          cat construction-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "LeiZ"
            git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
            git add construction-error.txt
            git commit -m "chore: capture direct matmul verification failure"
            git push origin HEAD:feat/direct-matmul-kernel
            exit "$status"
          fi
          rm construction-error.txt
      - name: Commit verified working tree
        run: |
          git add -A
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git commit -m "feat: lower compositional matmul directly"
          git push origin HEAD:feat/direct-matmul-kernel
