name: fix-inplace-imports

on:
  push:
    branches:
      - feat/inplace-binary-effects

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fix_inplace_imports.py
      - run: git diff --check
      - name: Commit clean production tree
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add src
          git rm .github/workflows/fix-inplace-imports.yml tools/fix_inplace_imports.py
          git commit -m "fix: sort in-place effect imports"
          git push origin HEAD:feat/inplace-binary-effects
