name: update-inplace-docs

on:
  push:
    branches:
      - feat/inplace-binary-effects

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/update_inplace_docs.py
      - run: git diff --check
      - name: Commit clean phase status tree
        run: |
          git config user.name "LeiZ"
          git config user.email "52287354+Lei-TzuY@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git rm .github/workflows/update-inplace-docs.yml tools/update_inplace_docs.py
          git commit -m "docs: seal bounded in-place binary phase"
          git push origin HEAD:feat/inplace-binary-effects
